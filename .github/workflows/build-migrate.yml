name: Build & push image migrate

# Rebuild et publie l'image de migration sur GHCR quand les migrations changent.
# L'image est utilisée comme job one-shot avant le démarrage des services en prod.

on:
  push:
    branches: [main]
    paths:
      - "packages/db/prisma/**"
      - "Dockerfile.migrate"
      - ".github/workflows/build-migrate.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.migrate
          push: true
          tags: ghcr.io/replang-app/replang-migrate:latest
